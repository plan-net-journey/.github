name: Slash Command - Approve

on:
  issue_comment:
    types: [created]

jobs:
  approve:
    if: |
      contains(github.event.comment.body, '/approve') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add approved label
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);

            if (labels.includes('approved')) {
              core.info('Issue already has approved label');
            } else {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['approved']
              });
            }

            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            });

      - name: Handle access request
        if: contains(github.event.issue.labels.*.name, 'access-request')
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          BODY="${{ github.event.issue.body }}"
          USERNAME=$(echo "$BODY" | grep -A2 "GitHub Username" | tail -1 | xargs)

          if [ -z "$USERNAME" ] || [ -z "$GH_TOKEN" ]; then
            echo "Missing username or ORG_ADMIN_TOKEN secret"
            echo "Username extracted: '$USERNAME'"
            echo "Token present: $([ -n '${{ secrets.ORG_ADMIN_TOKEN }}' ] && echo 'yes' || echo 'no')"
            exit 1
          fi

          echo "Inviting ${USERNAME} to plan-net-journey..."

          USER_ID=$(gh api "users/${USERNAME}" --jq '.id' 2>/dev/null)
          if [ -z "$USER_ID" ]; then
            echo "Could not find GitHub user: ${USERNAME}"
            exit 1
          fi

          gh api orgs/plan-net-journey/invitations \
            -f "invitee_id=${USER_ID}" \
            -f role=direct_member 2>&1 || echo "Note: User may already be a member"

          echo "Done!"

      - name: Handle repo request
        if: contains(github.event.issue.labels.*.name, 'repo-request')
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          BODY="${{ github.event.issue.body }}"
          REPO_NAME=$(echo "$BODY" | grep -A2 "Repository Name" | tail -1 | xargs | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
          DESCRIPTION=$(echo "$BODY" | grep -A2 "Beschreibung" | tail -1 | xargs)

          if [ -z "$REPO_NAME" ] || [ -z "$GH_TOKEN" ]; then
            echo "Missing repo name or ORG_ADMIN_TOKEN secret"
            exit 1
          fi

          echo "Creating PRIVATE repo plan-net-journey/${REPO_NAME}..."
          gh repo create "plan-net-journey/${REPO_NAME}" \
            --private \
            --description "$DESCRIPTION" \
            --add-readme 2>&1

          MEMBERS=$(echo "$BODY" | grep -A2 "Team-Mitglieder" | tail -1 | xargs)
          if [ -n "$MEMBERS" ]; then
            IFS=',' read -ra MEMBER_ARRAY <<< "$MEMBERS"
            for MEMBER in "${MEMBER_ARRAY[@]}"; do
              MEMBER=$(echo "$MEMBER" | xargs | sed 's/@//g')
              if [ -n "$MEMBER" ]; then
                echo "Adding ${MEMBER} with push access..."
                gh api "repos/plan-net-journey/${REPO_NAME}/collaborators/${MEMBER}" \
                  -X PUT -f permission=push 2>/dev/null || echo "Warning: Could not add ${MEMBER}"
              fi
            done
          fi

      - name: Handle repo access request
        if: contains(github.event.issue.labels.*.name, 'repo-access')
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          BODY="${{ github.event.issue.body }}"
          REPO_NAME=$(echo "$BODY" | grep -A2 "Repository Name" | tail -1 | xargs)
          USERNAME=$(echo "$BODY" | grep -A2 "GitHub Username" | tail -1 | xargs | sed 's/@//g')
          PERMISSION_RAW=$(echo "$BODY" | grep -A2 "Berechtigungsstufe" | tail -1 | xargs)

          PERMISSION="push"
          if echo "$PERMISSION_RAW" | grep -qi "maintain"; then
            PERMISSION="maintain"
          elif echo "$PERMISSION_RAW" | grep -qi "admin"; then
            PERMISSION="admin"
          fi

          if [ -z "$REPO_NAME" ] || [ -z "$USERNAME" ] || [ -z "$GH_TOKEN" ]; then
            echo "Missing repo name, username, or ORG_ADMIN_TOKEN"
            exit 1
          fi

          echo "Adding ${USERNAME} to ${REPO_NAME} with ${PERMISSION} access..."
          gh api "repos/plan-net-journey/${REPO_NAME}/collaborators/${USERNAME}" \
            -X PUT -f permission="${PERMISSION}" 2>&1

          echo "Done!"

      - name: Comment and close
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            const body = issue.body;

            let message = '';
            if (labels.includes('access-request')) {
              const match = body.match(/GitHub Username[\s\S]*?\n\n(.+)/);
              const username = match ? match[1].trim() : 'unknown';
              message = `Einladung an **@${username}** wurde gesendet! Bitte check deine E-Mail fuer die GitHub Einladung.`;
            } else if (labels.includes('repo-request')) {
              const match = body.match(/Repository Name[\s\S]*?\n\n(.+)/);
              const repoName = match ? match[1].trim().toLowerCase().replace(/\s+/g, '-') : 'unknown';
              message = `Repository **plan-net-journey/${repoName}** wurde erstellt (private)! Clone: \`gh repo clone plan-net-journey/${repoName}\``;
            } else if (labels.includes('repo-access')) {
              const repoMatch = body.match(/Repository Name[\s\S]*?\n\n(.+)/);
              const userMatch = body.match(/GitHub Username[\s\S]*?\n\n(.+)/);
              const repoName = repoMatch ? repoMatch[1].trim() : 'unknown';
              const username = userMatch ? userMatch[1].trim() : 'unknown';
              message = `**@${username}** hat jetzt Zugang zu **plan-net-journey/${repoName}**!`;
            }

            if (message) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ ${message}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
