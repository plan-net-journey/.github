name: Slash Command - Approve

on:
  issue_comment:
    types: [created]

jobs:
  approve:
    if: |
      contains(github.event.comment.body, '/approve') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Parse issue and approve
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const title = issue.title || '';
            const labels = issue.labels.map(l => l.name);

            // Add approved label
            if (!labels.includes('approved')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['approved']
              });
            }

            // React to comment
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            });

            // Determine issue type from labels OR title
            let type = 'unknown';
            if (labels.includes('access-request') || title.toLowerCase().startsWith('access request')) {
              type = 'access';
            } else if (labels.includes('repo-request') || title.toLowerCase().startsWith('repo request')) {
              type = 'repo';
            } else if (labels.includes('repo-access') || title.toLowerCase().startsWith('repo access')) {
              type = 'repo-access';
            } else if (labels.includes('feedback') || title.toLowerCase().startsWith('feedback')) {
              type = 'feedback';
            }

            // Parse body fields — handles both formats:
            // "### Header\nvalue" and "### Header\n\nvalue"
            function getField(fieldName) {
              const regex = new RegExp(`###\\s*${fieldName}[\\s]*\\n+([^#\\n][^\\n]*)`, 'i');
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            }

            const username = getField('GitHub Username').replace('@', '');
            const email = getField('E-Mail Adresse');
            const fullName = getField('Voller Name');
            const repoName = getField('Repository Name').toLowerCase().replace(/\s+/g, '-');
            const description = getField('Beschreibung');
            const permission = getField('Berechtigungsstufe');
            const members = getField('Team-Mitglieder');

            core.setOutput('type', type);
            core.setOutput('username', username);
            core.setOutput('email', email);
            core.setOutput('full_name', fullName);
            core.setOutput('repo_name', repoName);
            core.setOutput('description', description);
            core.setOutput('permission', permission);
            core.setOutput('members', members);

            core.info(`Type: ${type}`);
            core.info(`Username: ${username}`);
            core.info(`Repo: ${repoName}`);

      - name: Handle access request
        if: steps.parse.outputs.type == 'access'
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          USERNAME: ${{ steps.parse.outputs.username }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$GH_TOKEN" ]; then
            echo "Missing username ('$USERNAME') or ORG_ADMIN_TOKEN"
            exit 1
          fi

          echo "Inviting ${USERNAME} to plan-net-journey..."
          USER_ID=$(gh api "users/${USERNAME}" --jq '.id' 2>/dev/null)
          if [ -z "$USER_ID" ]; then
            echo "Could not find GitHub user: ${USERNAME}"
            exit 1
          fi

          gh api orgs/plan-net-journey/invitations \
            -f "invitee_id=${USER_ID}" \
            -f role=direct_member 2>&1 || echo "Note: User may already be a member"

          echo "Adding ${USERNAME} to skill-users team..."
          gh api "orgs/plan-net-journey/teams/skill-users/memberships/${USERNAME}" \
            -X PUT -f role=member 2>/dev/null || echo "Note: Will be added after accepting org invite"

          echo "Done!"

      - name: Handle repo request
        if: steps.parse.outputs.type == 'repo'
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          REPO_NAME: ${{ steps.parse.outputs.repo_name }}
          DESCRIPTION: ${{ steps.parse.outputs.description }}
          MEMBERS: ${{ steps.parse.outputs.members }}
        run: |
          if [ -z "$REPO_NAME" ] || [ -z "$GH_TOKEN" ]; then
            echo "Missing repo name or ORG_ADMIN_TOKEN"
            exit 1
          fi

          echo "Creating PRIVATE repo plan-net-journey/${REPO_NAME} from template..."
          gh repo create "plan-net-journey/${REPO_NAME}" \
            --private \
            --description "$DESCRIPTION" \
            --template plan-net-journey/project-template 2>&1

          echo "Creating team '${REPO_NAME}' for repo access..."
          gh api orgs/plan-net-journey/teams -X POST --input - <<TEAMEOF || echo "Team may already exist"
          {"name": "${REPO_NAME}", "description": "Zugang zu ${REPO_NAME}", "privacy": "closed"}
          TEAMEOF

          TEAM_SLUG=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')

          echo "Giving team push access to repo..."
          gh api "orgs/plan-net-journey/teams/${TEAM_SLUG}/repos/plan-net-journey/${REPO_NAME}" \
            -X PUT -f permission=push 2>/dev/null || true

          echo "Giving maintainers admin access..."
          gh api "orgs/plan-net-journey/teams/maintainers/repos/plan-net-journey/${REPO_NAME}" \
            -X PUT -f permission=admin 2>/dev/null || true

          if [ -n "$MEMBERS" ]; then
            IFS=',' read -ra MEMBER_ARRAY <<< "$MEMBERS"
            for MEMBER in "${MEMBER_ARRAY[@]}"; do
              MEMBER=$(echo "$MEMBER" | xargs | sed 's/@//g')
              if [ -n "$MEMBER" ]; then
                echo "Adding ${MEMBER} to team ${TEAM_SLUG}..."
                gh api "orgs/plan-net-journey/teams/${TEAM_SLUG}/memberships/${MEMBER}" \
                  -X PUT -f role=member 2>/dev/null || echo "Warning: Could not add ${MEMBER} (maybe not an org member — add as collaborator instead)"
              fi
            done
          fi

      - name: Handle repo access request
        if: steps.parse.outputs.type == 'repo-access'
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          REPO_NAME: ${{ steps.parse.outputs.repo_name }}
          USERNAME: ${{ steps.parse.outputs.username }}
          PERMISSION_RAW: ${{ steps.parse.outputs.permission }}
        run: |
          PERMISSION="push"
          if echo "$PERMISSION_RAW" | grep -qi "maintain"; then
            PERMISSION="maintain"
          elif echo "$PERMISSION_RAW" | grep -qi "admin"; then
            PERMISSION="admin"
          fi

          if [ -z "$REPO_NAME" ] || [ -z "$USERNAME" ] || [ -z "$GH_TOKEN" ]; then
            echo "Missing repo name, username, or ORG_ADMIN_TOKEN"
            exit 1
          fi

          TEAM_SLUG=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')

          echo "Adding ${USERNAME} to team ${TEAM_SLUG}..."
          gh api "orgs/plan-net-journey/teams/${TEAM_SLUG}/memberships/${USERNAME}" \
            -X PUT -f role=member 2>&1 || {
            echo "Team not found or user not an org member — adding as direct collaborator..."
            gh api "repos/plan-net-journey/${REPO_NAME}/collaborators/${USERNAME}" \
              -X PUT -f permission="${PERMISSION}" 2>&1
          }

      - name: Comment and close
        uses: actions/github-script@v7
        env:
          ISSUE_TYPE: ${{ steps.parse.outputs.type }}
          USERNAME: ${{ steps.parse.outputs.username }}
          REPO_NAME: ${{ steps.parse.outputs.repo_name }}
        with:
          script: |
            const type = process.env.ISSUE_TYPE;
            const username = process.env.USERNAME;
            const repoName = process.env.REPO_NAME;

            const ticketHint = `\n\n---\n**Weitere Berechtigungen?** Alles laeuft ueber Tickets im [admin-ops Repo](https://github.com/plan-net-journey/admin-ops/issues/new/choose):\n- Repo-Zugang, neues Repo, Feedback — alles dort.`;

            let message = '';
            if (type === 'access') {
              message = `Einladung an **@${username}** wurde gesendet!\n\nBitte check deine E-Mail fuer die GitHub Einladung. Nach Annahme hast du:\n- Zugang zur Organisation\n- Lesezugang zum Journey-Skills Marketplace` + ticketHint;
            } else if (type === 'repo') {
              message = `Repository **plan-net-journey/${repoName}** wurde erstellt (private)!\n\nClone: \`gh repo clone plan-net-journey/${repoName}\`` + ticketHint;
            } else if (type === 'repo-access') {
              message = `**@${username}** hat jetzt Zugang zu **plan-net-journey/${repoName}**!` + ticketHint;
            } else if (type === 'feedback') {
              message = `Danke fuer das Feedback! Wir schauen uns das an.`;
            }

            if (message) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `✅ ${message}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed'
              });
            }
