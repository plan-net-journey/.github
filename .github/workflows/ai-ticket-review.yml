name: AI Ticket Review

on:
  issues:
    types: [opened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check for similar repos on repo requests
        if: startsWith(github.event.issue.title, 'Repo Request')
        uses: actions/github-script@v7
        env:
          AI_GATEWAY_KEY: ${{ secrets.AI_GATEWAY_KEY }}
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        with:
          script: |
            const title = context.payload.issue.title || '';
            const body = context.payload.issue.body || '';

            if (!process.env.AI_GATEWAY_KEY) return;

            // Get all existing repos
            const repos = await github.paginate(github.rest.repos.listForOrg, {
              org: 'plan-net-journey',
              type: 'all',
              per_page: 100
            });

            const repoList = repos.map(r => `${r.name} — ${r.description || '(keine Beschreibung)'}`).join('\n');

            const systemPrompt = `Du pruefst ob ein angefragtes neues Repository moeglicherweise schon existiert.

Bestehende Repos in der Organisation:
${repoList}

Pruefe:
1. Gibt es ein Repo mit gleichem oder aehnlichem Namen?
2. Gibt es ein Repo das laut Beschreibung den gleichen Zweck hat?
3. Koennte es sein dass der User einfach keinen Zugang zu einem bestehenden Repo hat?

Antworte kurz auf Deutsch. Format:
**Aehnliche Repos gefunden:** Ja/Nein
**Details:** [welche Repos aehnlich sind und warum, oder "Kein aehnliches Repo gefunden"]
**Empfehlung:** [Neues Repo anlegen / Erst pruefen ob Zugang zu bestehendem Repo reicht]`;

            const userPrompt = `Angefragtes Repo:\n${title}\n\n${body}`;

            try {
              const url = 'https://ai.kodosumi.io/claude-sweden/openai/deployments/DeepSeek-V4-Flash/chat/completions?api-version=2024-10-21';
              const response = await fetch(url, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-api-key': process.env.AI_GATEWAY_KEY
                },
                body: JSON.stringify({
                  messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userPrompt }
                  ],
                  max_tokens: 300
                })
              });

              const data = await response.json();
              const review = data.choices?.[0]?.message?.content;

              if (review) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `**Duplikat-Check** (AI)\n\n${review}\n\n---\n*Automatische Pruefung — Maintainer entscheidet.*`
                });
              }
            } catch (err) {
              core.warning(`AI review failed: ${err.message}`);
            }
