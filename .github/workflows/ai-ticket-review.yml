name: AI Ticket Review

on:
  issues:
    types: [opened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: AI reviews the ticket
        uses: actions/github-script@v7
        env:
          AI_GATEWAY_KEY: ${{ secrets.AI_GATEWAY_KEY }}
        with:
          script: |
            const title = context.payload.issue.title || '';
            const body = context.payload.issue.body || '';
            const author = context.payload.issue.user.login;

            // Skip if no AI key or if it's a feedback ticket
            if (!process.env.AI_GATEWAY_KEY) return;
            if (title.toLowerCase().startsWith('feedback')) return;

            let type = 'unbekannt';
            if (title.toLowerCase().startsWith('access request')) type = 'Org-Zugang';
            else if (title.toLowerCase().startsWith('repo request')) type = 'Neues Repo';
            else if (title.toLowerCase().startsWith('repo access')) type = 'Repo-Zugang';

            const systemPrompt = `Du bist ein Admin-Assistent fuer die GitHub Organisation "plan-net-journey" (Plan Net Journey).
Deine Aufgabe: Tickets pruefen und dem Maintainer eine kurze Empfehlung geben.

Regeln der Organisation:
- Alle Repos muessen private sein
- GitHub Account sollte @house-of-communication.com E-Mail haben (fuer neue Accounts empfohlen, bestehende Accounts sind ok)
- SSH Keys sind Pflicht
- Neue User bekommen automatisch Lesezugang zum Journey-Skills Marketplace

Antworte kurz und auf Deutsch. Format:
**Zusammenfassung:** [was der User will, 1 Satz]
**Pruefung:** [sind die Angaben vollstaendig und plausibel?]
**Empfehlung:** [Freigeben / Nachfragen / Ablehnen — mit kurzer Begruendung]`;

            const userPrompt = `Ticket-Typ: ${type}
Titel: ${title}
Erstellt von: ${author}

Inhalt:
${body}`;

            try {
              const url = 'https://ai.kodosumi.io/claude-sweden/openai/deployments/DeepSeek-V4-Flash/chat/completions?api-version=2024-10-21';
              const response = await fetch(url, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-api-key': process.env.AI_GATEWAY_KEY
                },
                body: JSON.stringify({
                  messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userPrompt }
                  ],
                  max_tokens: 300
                })
              });

              const data = await response.json();
              const review = data.choices?.[0]?.message?.content;

              if (review) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `**AI Review** (DeepSeek-V4-Flash)\n\n${review}\n\n---\n*Automatische Vorpruefung — Maintainer entscheidet.*`
                });
              }
            } catch (err) {
              core.warning(`AI review failed: ${err.message}`);
            }
