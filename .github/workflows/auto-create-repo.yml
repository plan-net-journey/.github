name: Auto-Create Repo on Approval

on:
  issues:
    types: [labeled]

jobs:
  create-repo:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'repo-request')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Extract repo details from issue
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;

            const nameMatch = body.match(/Repository Name\s*\n\n(.+)/);
            const visMatch = body.match(/Sichtbarkeit\s*\n\n(.+)/);
            const descMatch = body.match(/Beschreibung\s*\n\n([\s\S]*?)(?=\n\n###|\n\nTeam|$)/);
            const membersMatch = body.match(/Team-Mitglieder.*\n\n(.+)/);

            if (!nameMatch) {
              core.setFailed('Could not extract repo name');
              return;
            }

            const repoName = nameMatch[1].trim().toLowerCase().replace(/\s+/g, '-');
            const isPrivate = !visMatch || visMatch[1].includes('Private');
            const description = descMatch ? descMatch[1].trim() : '';
            const members = membersMatch ? membersMatch[1].trim() : '';

            core.setOutput('repo_name', repoName);
            core.setOutput('is_private', isPrivate.toString());
            core.setOutput('description', description);
            core.setOutput('members', members);

      - name: Create repository
        if: steps.extract.outputs.repo_name != ''
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          REPO_NAME="${{ steps.extract.outputs.repo_name }}"
          IS_PRIVATE="${{ steps.extract.outputs.is_private }}"
          DESCRIPTION="${{ steps.extract.outputs.description }}"

          VISIBILITY_FLAG="--private"
          if [ "$IS_PRIVATE" = "false" ]; then
            VISIBILITY_FLAG="--public"
          fi

          echo "Creating repo plan-net-journey/${REPO_NAME}..."
          gh repo create "plan-net-journey/${REPO_NAME}" \
            $VISIBILITY_FLAG \
            --description "$DESCRIPTION" \
            --add-readme \
            || { echo "Failed to create repo"; exit 1; }

          echo "Repository created successfully!"

      - name: Add team members
        if: steps.extract.outputs.members != ''
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          REPO_NAME="${{ steps.extract.outputs.repo_name }}"
          MEMBERS="${{ steps.extract.outputs.members }}"

          IFS=',' read -ra MEMBER_ARRAY <<< "$MEMBERS"
          for MEMBER in "${MEMBER_ARRAY[@]}"; do
            MEMBER=$(echo "$MEMBER" | xargs | sed 's/@//g')
            if [ -n "$MEMBER" ]; then
              echo "Adding ${MEMBER} to ${REPO_NAME}..."
              gh api repos/plan-net-journey/${REPO_NAME}/collaborators/${MEMBER} \
                -X PUT -f permission=push 2>/dev/null || echo "Warning: Could not add ${MEMBER}"
            fi
          done

      - name: Comment and close issue
        if: steps.extract.outputs.repo_name != ''
        uses: actions/github-script@v7
        with:
          script: |
            const repoName = '${{ steps.extract.outputs.repo_name }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Repository **plan-net-journey/${repoName}** wurde erstellt!\n\nClone: \`gh repo clone plan-net-journey/${repoName}\``
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
