name: Notify Maintainers

on:
  issues:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Post instructions for maintainers
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title || '';
            const author = context.payload.issue.user.login;

            let type = '';
            if (title.toLowerCase().startsWith('access request')) type = 'Org-Zugang';
            else if (title.toLowerCase().startsWith('repo request')) type = 'Neues Repo';
            else if (title.toLowerCase().startsWith('repo access')) type = 'Repo-Zugang';
            else if (title.toLowerCase().startsWith('feedback')) type = 'Feedback';
            else return;

            let message = `**${type}** von @${author}\n\n`;
            message += `@plan-net-journey/maintainers — bitte pruefen und mit \`/approve\` freigeben oder mit Kommentar ablehnen.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
