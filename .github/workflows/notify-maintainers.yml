name: Notify Maintainers

on:
  issues:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Post instructions and notify Teams
        uses: actions/github-script@v7
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        with:
          script: |
            const title = context.payload.issue.title || '';
            const author = context.payload.issue.user.login;
            const issueUrl = context.payload.issue.html_url;
            const number = context.payload.issue.number;

            let type = '';
            let color = '0078D4';
            if (title.toLowerCase().startsWith('access request')) { type = 'Org-Zugang'; color = 'FFD43B'; }
            else if (title.toLowerCase().startsWith('repo request')) { type = 'Neues Repo'; color = '4DABF7'; }
            else if (title.toLowerCase().startsWith('repo access')) { type = 'Repo-Zugang'; color = '9775FA'; }
            else if (title.toLowerCase().startsWith('feedback')) { type = 'Feedback'; color = '51CF66'; }
            else return;

            // GitHub Comment
            let message = `**${type}** von @${author}\n\n`;
            message += `@plan-net-journey/maintainers — bitte pruefen:\n\n`;
            message += `1. Oeffne **admin-ops** in Claude Code\n`;
            message += `2. Sage \`/ticket-bearbeiten\`\n`;
            message += `3. Freigeben mit \`/approve\` oder ablehnen mit Kommentar`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });

            // Teams Notification
            const webhookUrl = process.env.TEAMS_WEBHOOK_URL;
            if (webhookUrl) {
              const card = {
                type: "message",
                attachments: [{
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      {
                        type: "Container",
                        style: "emphasis",
                        items: [{
                          type: "TextBlock",
                          text: `${type} #${number}`,
                          weight: "Bolder",
                          size: "Medium"
                        }]
                      },
                      {
                        type: "TextBlock",
                        text: title,
                        wrap: true,
                        weight: "Bolder"
                      },
                      {
                        type: "FactSet",
                        facts: [
                          { title: "Von", value: author },
                          { title: "Typ", value: type }
                        ]
                      },
                      {
                        type: "TextBlock",
                        text: "Oeffne **admin-ops** in Claude Code und sage `/ticket-bearbeiten`",
                        wrap: true,
                        spacing: "Medium"
                      }
                    ],
                    actions: [{
                      type: "Action.OpenUrl",
                      title: "Issue auf GitHub oeffnen",
                      url: issueUrl
                    }]
                  }
                }]
              };

              await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(card)
              }).catch(err => core.warning(`Teams notification failed: ${err.message}`));
            }
