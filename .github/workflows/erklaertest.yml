name: Erklaertest

# Einmaliger Test: Taugt DeepSeek-V4-Flash dafuer, eine Code-Aenderung so zu
# erklaeren, dass ein Fachmensch ohne Programmierkenntnisse darauf eine
# Entscheidung stuetzen kann? Ergebnis steht im Job-Log.
# Nach dem Test wieder loeschen.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Drei echte Diffs erklaeren lassen
        uses: actions/github-script@v7
        env:
          AI_GATEWAY_KEY: ${{ secrets.AI_GATEWAY_KEY }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const FAELLE = [
              {repo: 'Journey-Skills', pr: 3, warum: 'Verhaltensaenderung an einem Skill — der Kernfall'},
              {repo: '.github',        pr: 18, warum: 'Gestaltungsaenderung — fachliches Urteil gefragt'},
              {repo: 'Journey-Skills', pr: 6, warum: 'Reine Doku — Modell sollte sagen: nichts zu entscheiden'}
            ];

            const SYSTEM = [
              'Du erklaerst eine Aenderung an einem Software-Projekt fuer jemanden, der NICHT programmiert.',
              'Er ist Fachexperte fuer den Inhalt und soll entscheiden, ob die Aenderung fachlich sinnvoll ist.',
              '',
              'Regeln:',
              '- Keine Fachbegriffe. Verboten: Pull Request, Commit, Branch, Merge, Repository, Diff, Deployment.',
              '- Deine Nachricht steht fuer sich allein. Er sieht sonst nichts — kein Ticket, keine Vorgeschichte.',
              '- Wenn es fachlich nichts zu entscheiden gibt, sag das deutlich. Das ist eine gute Antwort.',
              '- Deutsch. Keine Umlaute vermeiden, normal schreiben.',
              '',
              'Antworte in GENAU diesem Format, ohne Zusaetze:',
              '',
              'TITEL: <eine Zeile, was sich aendert>',
              'VORHER: <wie es bisher war, 1-2 Saetze>',
              'NACHHER: <wie es kuenftig ist, 1-2 Saetze>',
              'MERKBAR: <woran er den Unterschied im Alltag merkt — oder "Nichts, das im Alltag auffaellt">',
              'ENTSCHEIDUNG: <die konkrete Frage an ihn — oder "Nichts zu entscheiden, nur zur Kenntnis">'
            ].join('\n');

            for (const f of FAELLE) {
              core.startGroup(`${f.repo} #${f.pr} — ${f.warum}`);
              try {
                const {data: pr} = await github.rest.pulls.get({
                  owner: 'plan-net-journey', repo: f.repo, pull_number: f.pr
                });
                const diffResp = await github.request(
                  'GET /repos/{owner}/{repo}/pulls/{pull_number}',
                  {owner: 'plan-net-journey', repo: f.repo, pull_number: f.pr,
                   headers: {accept: 'application/vnd.github.v3.diff'}}
                );
                let diff = String(diffResp.data);
                const voll = diff.length;
                if (diff.length > 12000) diff = diff.slice(0, 12000) + '\n[… gekuerzt]';

                console.log(`Titel:      ${pr.title}`);
                console.log(`Dateien:    ${pr.changed_files}   +${pr.additions}/-${pr.deletions}`);
                console.log(`Diff:       ${voll} Zeichen${voll > 12000 ? ' (gekuerzt auf 12000)' : ''}`);
                console.log('');

                const t0 = Date.now();
                const resp = await fetch(
                  'https://ai.kodosumi.io/claude-sweden/openai/deployments/DeepSeek-V4-Flash/chat/completions?api-version=2024-10-21',
                  {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'x-api-key': process.env.AI_GATEWAY_KEY},
                    body: JSON.stringify({
                      messages: [
                        {role: 'system', content: SYSTEM},
                        {role: 'user', content: `Titel der Aenderung: ${pr.title}\n\nAenderung:\n${diff}`}
                      ],
                      max_tokens: 500,
                      temperature: 0.2
                    })
                  }
                );
                const ms = Date.now() - t0;

                if (!resp.ok) {
                  console.log(`FEHLER: HTTP ${resp.status}`);
                  console.log((await resp.text()).slice(0, 400));
                } else {
                  const data = await resp.json();
                  console.log('--- Antwort des Modells ---');
                  console.log(data.choices?.[0]?.message?.content || '(leer)');
                  console.log('---');
                  console.log(`Dauer: ${ms} ms   Tokens: ${JSON.stringify(data.usage || {})}`);
                }
              } catch (e) {
                console.log('FEHLER: ' + e.message);
              }
              core.endGroup();
            }
