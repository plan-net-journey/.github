name: "Feedback zum Workflow"
description: "Feedback, Verbesserungsvorschlaege oder Fragen zum PNJ GitHub Setup"
title: "Feedback: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        ## Dein Feedback ist wichtig!
        Dieses Setup ist ein **Draft** und wird aktiv weiterentwickelt. Sag uns was gut laeuft, was nicht klar ist, oder was fehlt.

  - type: dropdown
    id: type
    attributes:
      label: Art des Feedbacks
      options:
        - Etwas ist unklar / schlecht erklaert
        - Etwas fehlt
        - Etwas funktioniert nicht
        - Verbesserungsvorschlag
        - Allgemeines Feedback
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Bereich
      options:
        - Onboarding (Account, SSH, Setup)
        - Ticket-Workflows (Repos, Zugang)
        - Skills / Marketplace
        - Projektstruktur / Templates
        - Grosse Dateien / Symlinks
        - Sonstiges
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: Dein Feedback
      placeholder: "Was ist dir aufgefallen? Was wuerdest du aendern?"
    validations:
      required: true
